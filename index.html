<html lang="ko">

  <style>

    button, input, textarea, select { font: inherit; color: inherit; }

    .personal-note-image button { position: absolute; top: 5px; right: 5px; width: 23px; height: 23px; border: 0; border-radius: 50%; background: rgba(20,26,22,.8); color: white; }
    .calendar-view { flex: 1; min-height: 0; overflow: auto; padding: 12px; background: rgba(255,255,255,.34); }
    .calendar-layout { width: min(900px, 100%); min-height: 100%; margin: 0 auto; display: grid; grid-template-columns: minmax(360px, 1.35fr) minmax(250px, .8fr); gap: 10px; }
    .calendar-card, .calendar-note-card { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.8); }

    .calendar-note-card { display: flex; flex-direction: column; min-height: 320px; }

    .calendar-note-meta { display: flex; align-items: center; gap: 7px; margin: 2px 0 10px; color: var(--muted); font-size: 9px; }
    .calendar-note-editor { flex: 1; width: 100%; min-height: 250px; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); line-height: 1.55; font-size: 11px; }
    .empty { max-width: 360px; margin: 60px auto; text-align: center; color: var(--muted); }
    .empty b { color: var(--ink); display: block; margin-bottom: 7px; }
    .entry { display: grid; grid-template-columns: 28px 1fr; gap: 6px; margin-bottom: 4px; }
    .entry.entry-new { animation: entryIn .24s ease both; }
    @keyframes entryIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .entry.pin-lifting { z-index: 8; pointer-events: none; animation: pinLift .42s cubic-bezier(.2,.75,.25,1) both; }
    .entry.pin-lifting .bubble { border-color: #d8a43e; box-shadow: 0 0 0 3px rgba(216,164,62,.16), 0 12px 28px rgba(121,83,16,.18); }
    .entry.pin-arrived { animation: pinArrive .55s cubic-bezier(.2,.8,.25,1) both; }
    .entry.pin-arrived .bubble { animation: pinGlow .8s ease both; }
    @keyframes pinLift { 0% { opacity: 1; transform: translateY(0) scale(1); } 45% { opacity: 1; transform: translateY(-8px) scale(1.012); } 100% { opacity: 0; transform: translateY(-30px) scale(.985); } }
    @keyframes pinArrive { 0% { opacity: 0; transform: translateY(14px) scale(.985); } 65% { opacity: 1; transform: translateY(-2px) scale(1.006); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes pinGlow { 0%, 100% { box-shadow: none; } 35% { border-color: #d8a43e; box-shadow: 0 0 0 4px rgba(216,164,62,.18), 0 8px 24px rgba(121,83,16,.14); } }
    .pinned-stack { position: sticky; top: -10px; z-index: 5; padding: 10px 5px 5px; margin: -10px -5px 3px; background: #dbe6f5; color: #294364; }

    .pinned-stack .entry { margin-bottom: 6px; }

    .pinned-header:hover { background: #cbd9ed; }

    .today-group.collapsed .today-group-chevron { transform: rotate(-90deg); }

    @keyframes syncSpin { to { transform: rotate(360deg); } }
    .pin { color: #c58b28; font-size: 11px; }

    .bubble img { display: block; max-width: min(100%, 440px); max-height: 280px; object-fit: cover; border-radius: 7px; margin-top: 6px; cursor: zoom-in; }

    .folder-icon { font-size: 17px; }
    .shared-project strong { display: block; font-size: 12px; }
    .shared-project small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .add-project { width: 100%; border: 1px dashed #b9beb8; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; font-size: 11px; }
    .sync-indicator { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.85); color: var(--muted); font-size: 9px; }
    .sync-indicator::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #56a373; }
    .modal-wrap { position: fixed; inset: 0; background: rgba(20,26,22,.48); display: grid; place-items: center; padding: 18px; z-index: 20; backdrop-filter: blur(7px); }
    .modal { width: min(420px, 100%); background: #fbfcf8; border-radius: 16px; padding: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.24); animation: modalIn .18s ease both; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(6px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal h2 { margin: 0 0 4px; letter-spacing: -.04em; font-size: 18px; }
    .modal > p { color: var(--muted); margin: 0 0 14px; font-size: 11px; line-height: 1.55; }
    .user-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .user-choice button { border: 1px solid var(--line); background: white; padding: 14px; border-radius: 12px; }
    .user-choice .avatar { margin: 0 auto 7px; width: 36px; height: 36px; }
    .form-group { margin: 11px 0; }
    .form-group label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; border: 1px solid var(--line); background: white; padding: 8px; border-radius: 8px; }
    .form-group textarea { min-height: 82px; resize: vertical; }
    .security-note { padding: 9px 10px; border-radius: 9px; background: #fff0d7; color: #7d591e; font-size: 10px; line-height: 1.5; }
    .form-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
    .btn { border: 1px solid var(--line); background: white; padding: 7px 10px; border-radius: 8px; font-size: 12px; }
    .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
    .settings-users { display: grid; gap: 10px; }
    .settings-row { display: grid; grid-template-columns: 1fr 50px; gap: 8px; }
    .sync-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 9px 14px; border-radius: 99px; font-size: 11px; z-index: 50; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: grid; place-items: center; z-index: 60; padding: 30px; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    @media (max-width: 1050px) { .app { grid-template-columns: 220px 1fr; } .rightbar { display: none; } }
    @media (max-width: 720px) {
      html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; }
      body { background: var(--bg); touch-action: manipulation; }
      .app { display: block; padding: 0; width: 100%; height: 100dvh; height: var(--app-height); overflow: hidden; }
      .sidebar, .rightbar, .topbar { display: none; }
      .main { height: 100%; min-height: 0; border: 0; border-radius: 0; box-shadow: none; background: color-mix(in srgb, var(--panel) 86%, var(--bg)); overflow: hidden; }
      body { font-size: 12px; }
      .mobile-bar { display: flex; align-items: center; gap: 5px; padding: max(6px, env(safe-area-inset-top)) 7px 6px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 92%, white); backdrop-filter: blur(14px); }
      .sync-warning { margin: 6px 8px 0; padding: 7px 9px; font-size: 10px; border-radius: 9px; }
      .mobile-bar select { min-width: 0; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 6px 7px; font-size: 10px; font-weight: 750; height: 30px; }
      #mobileProjectSelect { flex: 1; }
      #mobileUserSelect { width: 70px; color: var(--accent); }
      .mobile-add-project { width: 30px; height: 30px; flex: 0 0 auto; border: 1px solid var(--line); background: white; border-radius: 8px; color: var(--accent); font-size: 17px; font-weight: 800; line-height: 1; display: grid; place-items: center; }
      .mobile-title { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 7px; background: var(--ink); color: white; font-size: 8px; font-weight: 900; flex: 0 0 auto; }
      .feed { padding: 8px 7px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      .personal-note-view { padding: 7px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      .personal-note-card { padding: 10px; border-radius: 10px; box-shadow: none; }
      .personal-note-card h2 { font-size: 14px; }
      .personal-note-editor { min-height: calc(var(--app-height) - 112px); font-size: 12px; line-height: 1.5; }
      .personal-note-images { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-bottom: 10px; }
      .personal-note-image img { height: 82px; border-radius: 8px; }
      .calendar-view { padding: 7px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
      .calendar-layout { display: block; min-height: 0; }
      .calendar-card, .calendar-note-card { padding: 9px; border-radius: 9px; }
      .calendar-note-card { margin-top: 7px; min-height: 210px; }
      .calendar-day { min-height: 38px; padding: 5px; font-size: 9px; }
      .calendar-note-editor { min-height: 155px; }
      .entry { grid-template-columns: 22px minmax(0, 1fr); gap: 5px; margin-bottom: 4px; }
      .today-group { margin-bottom: 11px; }
      .today-group-head { top: -8px; margin-bottom: 5px; padding: 6px 7px; border-radius: 7px; }
      .pinned-stack { top: -10px; padding-top: 10px; margin-top: -10px; }
      .pinned-stack.collapsed { top: 0; padding: 2px 6px; margin: 0 -6px 3px; }
      .pinned-header { font-size: 11px; margin-bottom: 4px; }
      .pinned-state { font-size: 10px; }
      .entry .avatar { width: 22px; height: 22px; font-size: 8px; }
      .entry-head { margin-bottom: 2px; gap: 5px; }
      .entry-name { font-size: 11px; }
      .entry-time { font-size: 8px; }
      .source-label { padding: 1px 5px; font-size: 8px; border-radius: 5px; }
      .entry-actions { display: none; }
      .bubble { padding: 7px 8px; border-radius: 4px 10px 10px 10px; font-size: 11px; line-height: 1.42; }
      .bubble img { max-height: 190px; margin-top: 6px; border-radius: 8px; }
      .file-item { max-width: 100%; }
      .file-link { padding: 5px 7px; border-radius: 7px; }
      .download-link { padding: 5px 7px; border-radius: 7px; }
      .composer { padding: 6px 7px max(7px, env(safe-area-inset-bottom)); flex: 0 0 auto; background: white; }
      .composer textarea { min-height: 38px; max-height: 82px; padding: 7px 8px; border-radius: 9px; font-size: 11px; line-height: 1.38; }
      .compose-tools { display: grid; grid-template-columns: 30px 30px 1fr; gap: 5px; margin-top: 4px; }
      .compose-tools select { padding: 5px 6px; font-size: 10px; }
      .send { margin-left: 0; width: 100%; padding: 6px; font-size: 10px; border-radius: 7px; }
      .preview { max-height: 54px; overflow-x: auto; flex-wrap: nowrap; padding-top: 3px; margin-bottom: 4px; }
      .preview img { width: 56px; height: 42px; }

      .empty { margin: 34px auto; padding: 0 16px; font-size: 11px; }
      .modal-wrap { padding: 10px; }
      .modal { border-radius: 14px; padding: 15px; max-height: calc(var(--app-height) - 24px); overflow: auto; }
      .modal h2 { font-size: 16px; }
      .form-group { margin: 9px 0; }
      .form-group input, .form-group textarea, .form-group select { padding: 7px; font-size: 12px; }
      .btn { padding: 6px 9px; font-size: 11px; }
    }
    @media (max-width: 390px) {
      #mobileUserSelect { width: 64px; }
      .mobile-title { display: none; }
      .mobile-add-project { width: 28px; }
      .feed { padding-inline: 6px; }
      .entry { grid-template-columns: 20px minmax(0, 1fr); }
      .entry .avatar { width: 20px; height: 20px; font-size: 7px; }
      .bubble { font-size: 10.5px; padding: 6px 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar">
      <div class="brand"><div class="brand-mark">&lt;/&gt;</div><div><strong>Devlog Duo</strong><small>Build, note, share.</small></div></div>
      <div class="user-switcher" id="userSwitcher"></div>
      <button class="nav-item" id="announcementButton" data-announcements><span>📌</span><span>공동 노트</span><span class="count" id="announcementCount">0</span></button>
      <div class="section-title">Project folders</div>
      <div id="sidebarProjects"></div>
      <div class="section-title">Personal folders</div>
      <div id="personalFolders"></div>
      <div class="section-title">Views</div>
      <button class="nav-item" data-view="today"><span>◷</span><span>Today's updates</span><span class="count" id="todayCount">0</span></button>
      <button class="nav-item" data-view="pinned"><span>★</span><span>Pinned updates</span><span class="count" id="pinnedCount">0</span></button>
      <button class="nav-item" data-view="all"><span>⌘</span><span>All activity</span><span class="count" id="allCount">0</span></button>
      <button class="nav-item" data-view="calendar"><span>□</span><span>Calendar</span><span class="count" id="calendarNoteCount">0</span></button>
      <div class="user-card">
        <div class="avatar" id="activeAvatar">C</div>
        <div><strong id="activeName">Clem</strong><small>Current writer</small></div>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </aside>

    <main class="panel main">
      <div class="mobile-bar">
        <div class="mobile-title">&lt;/&gt;</div>
        <select id="mobileProjectSelect" aria-label="프로젝트 선택"></select>
        <button class="mobile-add-project" id="mobileAddProjectBtn" title="프로젝트 추가" aria-label="프로젝트 추가">+</button>
        <select id="mobileUserSelect" aria-label="작성자 선택"></select>
      </div>
      <header class="topbar">
        <div class="topline">
          <div class="project-heading"><h1 id="projectTitle">Loading...</h1><p id="projectSubtitle">Shared development journal</p></div>
          <div class="search"><span>⌕</span><input id="searchInput" placeholder="Search"></div>
        </div>
      </header>
      <div class="sync-warning hidden" id="syncWarning"></div>
      <section class="feed" id="feed"></section>
      <section class="personal-note-view hidden" id="personalNoteView">
        <div class="personal-note-card">
          <h2 id="personalNoteTitle">Personal note</h2>
          <div class="personal-note-images hidden" id="personalNoteImages"></div>
          <textarea class="personal-note-editor" id="personalNoteEditor" placeholder="생각나는 내용을 자유롭게 적으세요..."></textarea>
        </div>
      </section>
      <section class="calendar-view hidden" id="calendarView">
        <div class="calendar-layout">
          <div class="calendar-card">
            <div class="calendar-toolbar"><button data-calendar-month="-1" aria-label="이전 달">‹</button><strong id="calendarMonthTitle"></strong><button data-calendar-today>Today</button><button data-calendar-month="1" aria-label="다음 달">›</button></div>
            <div class="calendar-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
          <div class="calendar-note-card">
            <h2 id="calendarNoteTitle"></h2>
            <div class="calendar-note-meta"><span>Date note</span><span id="calendarNoteStatus"></span></div>
            <textarea class="calendar-note-editor" id="calendarNoteEditor" placeholder="이 날짜의 일정, 아이디어, 개발 메모를 기록하세요..."></textarea>
          </div>
        </div>
      </section>
      <section class="composer">
        <div id="imagePreview" class="preview hidden"></div>
        <textarea id="messageInput" aria-label="메시지 작성"></textarea>
        <div class="compose-tools">
          <button class="icon-btn" id="imageBtn" title="사진 첨부">＋</button>
          <input class="hidden" type="file" accept="image/*" multiple id="imageInput">
          <button class="icon-btn" id="fileBtn" title="파일 첨부">F</button>
          <input class="hidden" type="file" multiple id="fileInput">
          <button class="send" id="sendBtn">Post update</button>
        </div>
      </section>
    </main>

    <aside class="panel rightbar">
      <section class="right-section">
        <div class="right-head"><h2>Shared projects</h2><span class="count" id="projectCount"></span></div>
        <div id="sharedProjects"></div>
        <button class="add-project" id="addProjectBtn">＋ Add project folder</button>
      </section>
      <div class="sync-indicator" id="syncStatus" title="Supabase 실시간 공유 · Clem과 Ryan의 모바일·PC에서 기록을 자동 공유합니다.">연결 확인 중</div>
    </aside>
  </div>

  <div class="modal-wrap hidden" id="userModal">
    <div class="modal"><h2>누가 기록하나요?</h2><p>처음 사용할 작성자를 선택하세요. 이후에는 왼쪽 위 Clem / Ryan 버튼으로 바로 전환할 수 있습니다.</p><div class="user-choice" id="userChoices"></div></div>
  </div>
  <div class="modal-wrap hidden" id="formModal"><div class="modal" id="formModalContent"></div></div>
  <div class="toast hidden" id="toast"></div>
  <div class="lightbox hidden" id="lightbox"><img alt="Attached preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const STORE_KEY = "devlog-duo-v1";
    const PENDING_SYNC_KEY = "devlog-duo-pending-sync";
    const LAST_LOCATION_KEY = "devlog-duo-last-location";
    const TODAY_COLLAPSED_KEY = "devlog-duo-today-collapsed";
    const CALENDAR_DATE_KEY = "devlog-duo-calendar-date";
    const REMOTE_ROW_ID = "shared";
    const FILE_BUCKET = "devlog-files";
    const MAX_FILE_BYTES = 50 * 1024 * 1024;
    let supabaseClient = null;
    let realtimeChannel = null;
    let remoteSaveTimer = null;
    let syncRetryTimer = null;
    let applyingRemoteState = false;
    let pendingRemoteSync = localStorage.getItem(PENDING_SYNC_KEY) === "true";
    const seed = {
      users: {
        clem: { id: "clem", name: "Clem", color: "#2f7d5b", note: "- 오늘 확인할 PR\\n- API 에러 로그 정리" },
        ryan: { id: "ryan", name: "Ryan", color: "#8a5a9d", note: "- 배포 전 체크리스트\\n- UI 간격 다시 보기" }
      },
      projects: [{ id: "general", name: "General", desc: "Shared project", color: "#4d82a8" }],
      entries: [],
      calendarNotes: {},
      activeUser: null, activeProject: "general", activeView: "project", settings: { showNames: true }, dataVersion: 2
    };
    let state = loadState();
    restoreLastLocation();
    let pendingImages = [];
    let pendingFiles = [];
    let pinnedCollapsed = localStorage.getItem("devlog-duo-pinned-collapsed") === "true";
    let collapsedTodayGroups = new Set(readStoredArray(TODAY_COLLAPSED_KEY));
    let entryDeliveryStatuses = new Map();
    let deliveryStatusTimer = null;
    let viewSwitchTimer = null;
    let calendarSelectedDate = /^\d{4}-\d{2}-\d{2}$/.test(localStorage.getItem(CALENDAR_DATE_KEY) || "") ? localStorage.getItem(CALENDAR_DATE_KEY) : localDateKey(new Date());
    let calendarCursor = dateFromKey(calendarSelectedDate);
    let deviceTheme = localStorage.getItem("devlog-duo-theme") || "light";

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const escapeHtml = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function readStoredArray(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key));
        return Array.isArray(value) ? value : [];
      } catch { return []; }
    }
    function restoreLastLocation() {
      try {
        const location = JSON.parse(localStorage.getItem(LAST_LOCATION_KEY));
        if (location) {
          if (location.activeView) state.activeView = location.activeView;
          if (location.activeProject && state.projects.some(project => project.id === location.activeProject)) state.activeProject = location.activeProject;
          if (location.noteUser && state.users[location.noteUser]) state.noteUser = location.noteUser;
          return;
        }
      } catch {}
      if (window.matchMedia("(max-width: 720px)").matches) state.activeView = "today";
    }
    function rememberLocation() {
      localStorage.setItem(LAST_LOCATION_KEY, JSON.stringify({ activeView: state.activeView, activeProject: state.activeProject, noteUser: state.noteUser }));
    }
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!saved) return structuredClone(seed);
        const merged = { ...seed, ...saved, settings: { ...seed.settings, ...saved.settings } };
        if (!saved.dataVersion) {
          const sampleIds = new Set(["launch", "website", "lab"]);
          const sampleTexts = new Set([
            "로그인 플로우 정리 완료. 이메일 인증 후 온보딩 화면으로 바로 연결되도록 수정했습니다.",
            "모바일에서 버튼이 화면 아래로 밀리는 이슈 발견. 내일 오전에 safe-area 포함해서 수정할게요.",
            "새 컬러 팔레트와 카드 컴포넌트 초안 추가. 밝은 배경에서도 대비가 충분한지 확인 필요."
          ]);
          const untouchedSample = merged.projects.length === 3
            && merged.projects.every(p => sampleIds.has(p.id))
            && merged.entries.length === 3
            && merged.entries.every(e => sampleTexts.has(e.text));
          if (untouchedSample) {
            merged.projects = structuredClone(seed.projects);
            merged.entries = [];
            merged.activeProject = seed.activeProject;
          }
          merged.dataVersion = 2;
          localStorage.setItem(STORE_KEY, JSON.stringify(merged));
        }
        return merged;
      } catch { return structuredClone(seed); }
    }
    function saveState(syncRemote = false) {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        rememberLocation();
        if (syncRemote && !applyingRemoteState) {
          markPendingSync();
          scheduleRemoteSave();
        }
        return true;
      } catch {
        toast("저장 공간이 부족합니다. 오래된 사진 기록을 삭제해주세요");
        return false;
      }
    }
    function sharedSnapshot() {
      return {
        users: state.users,
        projects: state.projects,
        entries: state.entries,
        calendarNotes: state.calendarNotes || {},
        settings: state.settings,
        dataVersion: state.dataVersion
      };
    }
    function markPendingSync() {
      pendingRemoteSync = true;
      localStorage.setItem(PENDING_SYNC_KEY, "true");
    }
    function clearPendingSync() {
      pendingRemoteSync = false;
      localStorage.removeItem(PENDING_SYNC_KEY);
    }
    function mergeById(remoteItems = [], localItems = []) {
      const merged = new Map();
      remoteItems.forEach(item => item?.id && merged.set(item.id, item));
      localItems.forEach(item => item?.id && merged.set(item.id, { ...(merged.get(item.id) || {}), ...item }));
      return [...merged.values()];
    }
    function mergeUsers(remoteUsers = {}, localUsers = {}) {
      const merged = { ...remoteUsers };
      for (const [id, localUser] of Object.entries(localUsers)) {
        const remoteUser = merged[id] || {};
        const personalImages = [...new Set([...(remoteUser.personalImages || []), ...(localUser.personalImages || [])])];
        merged[id] = { ...remoteUser, ...localUser };
        if (personalImages.length) merged[id].personalImages = personalImages;
      }
      return merged;
    }
    function mergeSharedState(remote = {}, local = state) {
      return {
        users: mergeUsers(remote.users, local.users),
        projects: mergeById(remote.projects, local.projects),
        entries: mergeById(remote.entries, local.entries).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)),
        calendarNotes: { ...(remote.calendarNotes || {}), ...(local.calendarNotes || {}) },
        settings: { ...(remote.settings || {}), ...(local.settings || {}) },
        dataVersion: Math.max(remote.dataVersion || 0, local.dataVersion || 0, seed.dataVersion)
      };
    }
    function expandTodayGroupsWithNewEntries(previousEntries = [], nextEntries = []) {
      if (state.activeView !== "today" || !collapsedTodayGroups.size) return;
      const countTodayByProject = entries => entries.reduce((counts, entry) => {
        if (isToday(entry.createdAt)) counts.set(entry.projectId, (counts.get(entry.projectId) || 0) + 1);
        return counts;
      }, new Map());
      const before = countTodayByProject(previousEntries);
      const after = countTodayByProject(nextEntries);
      let changed = false;
      after.forEach((count, projectId) => {
        if (count > (before.get(projectId) || 0) && collapsedTodayGroups.delete(projectId)) changed = true;
      });
      if (changed) localStorage.setItem(TODAY_COLLAPSED_KEY, JSON.stringify([...collapsedTodayGroups]));
    }
    function applySharedState(shared) {
      if (!shared) return;
      expandTodayGroupsWithNewEntries(state.entries, shared.entries || []);
      applyingRemoteState = true;
      state = {
        ...state,
        users: shared.users || state.users,
        projects: shared.projects || state.projects,
        entries: shared.entries || [],
        calendarNotes: shared.calendarNotes || state.calendarNotes || {},
        settings: { ...state.settings, ...(shared.settings || {}) },
        dataVersion: shared.dataVersion || state.dataVersion
      };
      if (!state.projects.some(p => p.id === state.activeProject)) state.activeProject = state.projects[0]?.id;
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      applyingRemoteState = false;
      render();
    }
    function setSyncStatus(text) {
      const status = $("#syncStatus");
      if (status) status.textContent = text;
    }
    function setSyncWarning(message = "") {
      const warning = $("#syncWarning");
      if (!warning) return;
      warning.textContent = message;
      warning.classList.toggle("hidden", !message);
    }
    function reportSyncIssue(status, message, error) {
      setSyncStatus(status);
      setSyncWarning(message);

        return;

      supabaseClient ||= window.supabase.createClient(config.url, config.anonKey);
      setSyncStatus("연결 중");

      let error = null;
      try {
        ({ data, error } = await supabaseClient.from("app_state").select("data").eq("id", REMOTE_ROW_ID).maybeSingle());
      } catch (err) {
        error = err;

          <span class="folder-icon" style="color:${p.color}">▰</span><span><strong>${escapeHtml(p.name)}</strong><small>${count} updates · ${escapeHtml(p.desc)}</small></span></button>
          <button class="delete-project" data-delete-project="${p.id}" title="프로젝트 삭제">×</button></div>`;
      }).join("");
    }
    function deleteProject(id) {
      if (state.projects.length <= 1) return toast("프로젝트는 최소 한 개가 필요합니다");
      const project = state.projects.find(p => p.id === id);
      const count = state.entries.filter(e => e.projectId === id).length;
      if (!project || !confirm(`"${project.name}" 프로젝트와 기록 ${count}개를 모두 삭제할까요?\n\n삭제 비밀번호: 1234`)) return;
      if (prompt("삭제 비밀번호 1234를 입력하세요") !== "1234") return toast("비밀번호가 맞지 않아 삭제하지 않았습니다");
      state.projects = state.projects.filter(p => p.id !== id);
      state.entries = state.entries.filter(e => e.projectId !== id);
      if (state.activeProject === id) state.activeProject = state.projects[0].id;
      state.activeView = "project";
      saveState(true); render(); toast("프로젝트를 삭제했습니다");
    }
    function renderUserChoices() {
      $("#userChoices").innerHTML = Object.values(state.users).map(u => `<button data-choose-user="${u.id}"><span class="avatar" style="background:${u.color}">${initials(u.name)}</span><strong>${escapeHtml(u.name)}</strong></button>`).join("");
    }
    function chooseUser(id) { state.activeUser = id; saveState(); $("#userModal").classList.add("hidden"); render(); toast(`${state.users[id].name}으로 전환했습니다`); }
    function switchView(update) {
      clearTimeout(viewSwitchTimer);
      const main = $(".main");
      main.classList.add("view-switching");
      viewSwitchTimer = setTimeout(() => {
        update();
        saveState();
        render();
        requestAnimationFrame(() => requestAnimationFrame(() => main.classList.remove("view-switching")));
      }, 100);
    }
    function toggleTodayGroup(button) {
      const id = button.dataset.toggleTodayGroup;
      const section = button.closest("[data-today-group]");
      if (!section) return;
      const collapsed = section.classList.toggle("collapsed");
      button.setAttribute("aria-expanded", String(!collapsed));
      if (collapsed) collapsedTodayGroups.add(id);
      else collapsedTodayGroups.delete(id);
      localStorage.setItem(TODAY_COLLAPSED_KEY, JSON.stringify([...collapsedTodayGroups]));
    }
    async function togglePinGroup(button) {
      const ids = button.dataset.pinGroup.split(",");
      const selected = state.entries.filter(entry => ids.includes(entry.id));
      if (!selected.length) return;
      const shouldPin = !selected.every(entry => entry.pinned);
      const article = button.closest(".entry");
      if (shouldPin && article) {
        button.textContent = "Pinned ✓";
        article.classList.add("pin-lifting");
        const delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 20 : 400;
        await new Promise(resolve => setTimeout(resolve, delay));
      }
      const pinGroupId = crypto.randomUUID();
      const pinnedAt = Date.now();
      selected.forEach(entry => {
        entry.pinned = shouldPin;
        if (shouldPin) {
          entry.pinGroupId = pinGroupId;
          entry.pinnedAt = pinnedAt;
        } else {
          delete entry.pinGroupId;
          delete entry.pinnedAt;
        }
      });
      if (shouldPin) {
        pinnedCollapsed = false;
        localStorage.setItem("devlog-duo-pinned-collapsed", "false");
      }
      saveState(true);
      render();
      if (shouldPin) {
        const arrived = $$("[data-entry-group]").find(entry => entry.dataset.entryGroup.split(",").includes(ids[0]));
        if (arrived) {
          arrived.classList.add("pin-arrived");
          arrived.scrollIntoView({ behavior: "smooth", block: state.activeView === "today" ? "center" : "start" });
          setTimeout(() => arrived.classList.remove("pin-arrived"), 850);
        }
        toast("상단에 고정했습니다");
      } else {
        toast("고정을 해제했습니다");
      }
    }
    function postEntry() {
      const text = $("#messageInput").value.trim();
      if (!text && !pendingImages.length && !pendingFiles.length) return toast("내용, 사진 또는 파일을 추가해주세요");
      const targetView = state.activeView === "announcements" ? "announcements" : "project";
      const entry = { id: crypto.randomUUID(), projectId: targetView === "announcements" ? "__announcements__" : state.activeProject, userId: state.activeUser, text, images: [...pendingImages], files: [...pendingFiles], pinned: false, createdAt: Date.now() };
      state.entries.push(entry);
      entryDeliveryStatuses.set(entry.id, "syncing");
      state.activeView = targetView;
      $("#searchInput").value = "";
      if (!saveState(true)) {
        state.entries = state.entries.filter(e => e.id !== entry.id);
        entryDeliveryStatuses.delete(entry.id);
        return;
      }
      $("#messageInput").value = "";
      pendingImages = [];
      pendingFiles = [];
      renderImagePreview();
      render();
      toast("개발일지를 등록했습니다");
    }
    function renderImagePreview() {
      const box = $("#imagePreview");
      const imageHtml = pendingImages.map((src, i) => `<span class="preview-item"><img src="${src}" alt="첨부 미리보기"><button data-remove-image="${i}">×</button></span>`).join("");
      const fileHtml = pendingFiles.map((file, i) => `<span class="preview-file">File ${escapeHtml(file.name)}<small>${formatFileSize(file.size)}</small><button data-remove-file="${i}">×</button></span>`).join("");
      box.innerHTML = imageHtml + fileHtml;
      box.classList.toggle("hidden", !pendingImages.length && !pendingFiles.length);
    }
    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const max = 1600;
            const scale = Math.min(1, max / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", .82));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    async function addImageFiles(files) {
      const images = [...files].filter(file => file.type.startsWith("image/"));
      for (const file of images) {
        const compressed = await compressImage(file);
        pendingImages.push(compressed);
        renderImagePreview();
      }
      if (images.length) toast("사진을 첨부했습니다");
    }
    function safeFileName(name) {
      return name.normalize("NFKD").replace(/[^\w.\-]+/g, "_").replace(/^_+|_+$/g, "") || "file";
    }
    async function uploadFileAttachment(file) {
      if (!supabaseClient) throw new Error("Supabase is not connected");
      const path = `${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}-${safeFileName(file.name)}`;
      const { error } = await supabaseClient.storage.from(FILE_BUCKET).upload(path, file, {
        cacheControl: "3600",
        upsert: false
      });
      if (error) throw error;
      const { data } = supabaseClient.storage.from(FILE_BUCKET).getPublicUrl(path);
      return { name: file.name, type: file.type || "application/octet-stream", size: file.size, path, url: data.publicUrl };
    }
    async function addGeneralFiles(files) {
      const list = [...files].filter(file => file && !file.type.startsWith("image/"));
      if (!list.length) return;
      if (!supabaseClient) return reportSyncIssue("파일 오류", "파일 저장은 Supabase Storage 연결이 필요합니다. 연결 후 다시 시도해주세요.");
      const oversized = list.find(file => file.size > MAX_FILE_BYTES);
      if (oversized) return reportSyncIssue("파일 오류", `"${oversized.name}" 파일이 50MB보다 큽니다. 더 작은 파일로 올려주세요.`);
      toast("파일을 업로드하는 중입니다");
      try {
        for (const file of list) {
          pendingFiles.push(await uploadFileAttachment(file));
          renderImagePreview();
        }
        toast("파일을 첨부했습니다");
      } catch (error) {
        reportSyncIssue("파일 오류", `파일을 저장하지 못했습니다: ${readableError(error)}`, error);
      }
    }
    async function deleteEntryGroup(ids) {
      if (prompt("삭제 비밀번호 1234를 입력하세요") !== "1234") return toast("비밀번호가 맞지 않아 삭제하지 않았습니다");
      const selected = state.entries.filter(entry => ids.includes(entry.id));
      if (!selected.length) return;
      const paths = [...new Set(selected.flatMap(entry => (entry.files || []).map(file => file.path).filter(Boolean)))];
      if (paths.length) {
        if (!supabaseClient) return reportSyncIssue("파일 삭제 오류", "Storage 서버에 연결되지 않아 기록을 삭제하지 않았습니다. 연결 후 다시 시도해주세요.");
        toast("첨부 파일과 기록을 삭제하는 중입니다");
        let removed = [];
        let error = null;
        try {
          ({ data: removed, error } = await supabaseClient.storage.from(FILE_BUCKET).remove(paths));
        } catch (caught) {
          error = caught;
        }
        if (!error && removed?.length !== paths.length) error = new Error("Storage가 일부 파일을 삭제하지 않았습니다");
        if (error) return reportSyncIssue("파일 삭제 오류", `첨부 파일을 삭제하지 못해 기록을 유지했습니다: ${readableError(error)}`, error);
      }
      state.entries = state.entries.filter(entry => !ids.includes(entry.id));
      ids.forEach(id => entryDeliveryStatuses.delete(id));
      saveState(true);
      render();
      toast(paths.length ? "첨부 파일과 기록을 삭제했습니다" : "기록을 삭제했습니다");
    }
    async function addPersonalNoteImages(files) {
      const images = [...files].filter(file => file && file.type.startsWith("image/"));
      if (!images.length) return;
      const user = state.users[state.noteUser] || activeUser();
      user.personalImages ||= [];
      for (const file of images) user.personalImages.push(await compressImage(file));
      if (!saveState(true)) return;
      renderPersonalNote();
      toast("개인 노트에 사진을 추가했습니다");
    }
    function openProjectModal() {
      $("#formModalContent").innerHTML = `<h2>새 공유 프로젝트</h2><p>프로젝트별로 개발일지를 나눠 관리할 수 있습니다.</p>
        <div class="form-group"><label>Project name</label><input id="newProjectName" placeholder="예: Mobile App v2"></div>
        <div class="form-group"><label>Description</label><input id="newProjectDesc" placeholder="무엇을 만드는 프로젝트인가요?"></div>
        <div class="form-group"><label>Folder color</label><input id="newProjectColor" type="color" value="#4d82a8"></div>
        <div class="form-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="createProjectBtn">Create folder</button></div>`;
      $("#formModal").classList.remove("hidden");
    }
    function bytesToBase64(bytes) {
      return btoa(String.fromCharCode(...bytes));
    }
    function base64ToBytes(value) {
      return Uint8Array.from(atob(value), char => char.charCodeAt(0));
    }
    async function deriveNoteKey(password, salt) {
      const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, material, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    }
    async function encryptProjectNote(text, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveNoteKey(password, salt);
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
      return { salt: bytesToBase64(salt), iv: bytesToBase64(iv), data: bytesToBase64(new Uint8Array(encrypted)) };
    }
    async function decryptProjectNote(payload, password) {
      const salt = base64ToBytes(payload.salt);
      const iv = base64ToBytes(payload.iv);
      const key = await deriveNoteKey(password, salt);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, base64ToBytes(payload.data));
      return new TextDecoder().decode(decrypted);
    }
    async function openProjectDetail() {
      if (state.activeView !== "project") return;
      const password = prompt("프로젝트 노트 비밀번호 1234를 입력하세요");
      if (password !== "1234") return toast("비밀번호가 맞지 않습니다");
      const project = currentProject();
      let note = "";
      try {
        if (project.encryptedNote) note = await decryptProjectNote(project.encryptedNote, password);
        else if (project.details) note = [project.details.link, project.details.database, project.details.password, project.details.notes].filter(Boolean).join("\n\n");
      } catch {
        return toast("노트를 복호화하지 못했습니다");
      }
      $("#formModalContent").innerHTML = `<h2>${escapeHtml(project.name)} Note</h2><p>비밀번호 1234로 암호화된 프로젝트 공동 노트입니다.</p>
        <div class="form-group"><textarea id="encryptedProjectNote" placeholder="링크, DB 정보, 참고사항 등을 자유롭게 적으세요...">${escapeHtml(note)}</textarea></div>
        <div class="security-note">노트 내용은 브라우저에서 암호화된 후 Supabase에 저장됩니다.</div>
        <div class="form-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveProjectDetailBtn">Save note</button></div>`;
      $("#formModalContent").dataset.notePassword = password;
      $("#formModal").classList.remove("hidden");
    }
    function openSettings() {
      const users = Object.values(state.users);
      $("#formModalContent").innerHTML = `<h2>Settings</h2><p>작성자 이름과 글 색상, 표시 방식을 설정하고 데이터를 관리합니다.</p>
        <div class="settings-users">${users.map(u => `<div class="settings-row"><input data-name-setting="${u.id}" value="${escapeHtml(u.name)}"><input data-color-setting="${u.id}" type="color" value="${u.color}"></div>`).join("")}</div>
        <div class="form-group"><label>Theme</label><select id="themeSetting"><option value="light" ${deviceTheme === "light" ? "selected" : ""}>Light mode</option><option value="dark" ${deviceTheme === "dark" ? "selected" : ""}>Dark mode</option></select></div>
        <div class="form-group"><label><input type="checkbox" id="showNamesSetting" ${state.settings.showNames ? "checked" : ""}> 글 옆에 작성자 이름 표시</label></div>
        <div class="form-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveSettingsBtn">Save settings</button></div>`;
      $("#formModal").classList.remove("hidden");
    }
    document.addEventListener("click", e => {
      const t = e.target.closest("button, img");
      if (!t) return;
      if (t.dataset.chooseUser) chooseUser(t.dataset.chooseUser);
      if (t.dataset.announcements !== undefined) switchView(() => { state.activeView = "announcements"; });
      if (t.dataset.project) switchView(() => { state.activeProject = t.dataset.project; state.activeView = "project"; });
      if (t.dataset.deleteProject) deleteProject(t.dataset.deleteProject);
      if (t.dataset.personalNote) switchView(() => { state.noteUser = t.dataset.personalNote; state.activeView = "personalNote"; });
      if (t.dataset.view) switchView(() => { state.activeView = t.dataset.view; });
      if (t.dataset.pinGroup) togglePinGroup(t);
      if (t.dataset.toggleTodayGroup) toggleTodayGroup(t);
      if (t.dataset.calendarDate) selectCalendarDate(t.dataset.calendarDate);
      if (t.dataset.calendarMonth) moveCalendarMonth(Number(t.dataset.calendarMonth));
      if (t.dataset.calendarToday !== undefined) selectCalendarDate(localDateKey(new Date()));
      if (t.dataset.retrySync !== undefined) {
        entryDeliveryStatuses.forEach((status, id) => {
          if (status === "pending") entryDeliveryStatuses.set(id, "syncing");
        });
        updateDeliveryIndicators();
        setSyncStatus("재동기화 중");
        initializeSupabase();
      }
      if (t.closest("[data-toggle-pinned]")) {
        pinnedCollapsed = !pinnedCollapsed;
        localStorage.setItem("devlog-duo-pinned-collapsed", String(pinnedCollapsed));
        renderFeed();
      }
      if (t.dataset.delete) deleteEntryGroup([t.dataset.delete]);
      if (t.dataset.deleteGroup) deleteEntryGroup(t.dataset.deleteGroup.split(","));
      if (t.dataset.deleteNoteImage !== undefined) {
        const user = state.users[state.noteUser] || activeUser();
        user.personalImages.splice(Number(t.dataset.deleteNoteImage), 1);
        saveState(true); renderPersonalNote();
      }
      if (t.dataset.closeModal !== undefined || t.id === "formModal") $("#formModal").classList.add("hidden");
      if (t.matches(".bubble img, .personal-note-image img")) { $("#lightbox img").src = t.src; $("#lightbox").classList.remove("hidden"); }
    });
    $("#sendBtn").onclick = postEntry;
    $("#messageInput").addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
      e.preventDefault();
      postEntry();
    });
    $("#searchInput").addEventListener("input", renderFeed);
    $("#mobileProjectSelect").addEventListener("change", e => {
      const [type, id] = e.target.value.split(":");
      switchView(() => {
        if (type === "announcements") state.activeView = "announcements";
        else if (type === "today") state.activeView = "today";
        else if (type === "calendar") state.activeView = "calendar";
        else if (type === "note") { state.noteUser = id; state.activeView = "personalNote"; }
        else { state.activeProject = id; state.activeView = "project"; }
      });
    });
    $("#mobileUserSelect").addEventListener("change", e => chooseUser(e.target.value));
    $("#imageBtn").onclick = () => $("#imageInput").click();
    $("#imageInput").onchange = e => { addImageFiles(e.target.files); e.target.value = ""; };
    $("#fileBtn").onclick = () => $("#fileInput").click();
    $("#fileInput").onchange = e => { addGeneralFiles(e.target.files); e.target.value = ""; };
    $("#messageInput").addEventListener("paste", e => {
      const images = [...e.clipboardData.items].filter(item => item.type.startsWith("image/")).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      e.preventDefault();
      addImageFiles(images);
    });
    $("#imagePreview").onclick = e => {
      const button = e.target.closest("[data-remove-image]");
      const fileButton = e.target.closest("[data-remove-file]");
      if (!button && !fileButton) return;
      if (button) pendingImages.splice(Number(button.dataset.removeImage), 1);
      if (fileButton) pendingFiles.splice(Number(fileButton.dataset.removeFile), 1);
      renderImagePreview();
    };
    $("#personalNoteEditor").addEventListener("input", e => {
      clearTimeout(window.personalNoteTimer);
      window.personalNoteTimer = setTimeout(() => {
        const user = state.users[state.noteUser] || activeUser();
        user.personalNote = e.target.value;
        saveState(true);
      }, 350);
    });
    $("#personalNoteEditor").addEventListener("paste", e => {
      const images = [...e.clipboardData.items].filter(item => item.type.startsWith("image/")).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      e.preventDefault();
      addPersonalNoteImages(images);
    });
    $("#calendarNoteEditor").addEventListener("input", e => {
      const key = e.target.dataset.calendarNoteDate || calendarSelectedDate;
      const value = e.target.value;
      state.calendarNotes ||= {};
      state.calendarNotes[key] = value.trim() ? value : null;
      saveState();
      $("#calendarNoteStatus").textContent = "저장 중";
      const day = $(`[data-calendar-date="${key}"]`);
      if (day) day.classList.toggle("has-note", Boolean(value.trim()));
      clearTimeout(window.calendarNoteTimer);
      window.calendarNoteTimer = setTimeout(() => {
        if (!saveState(true)) return;
        $("#calendarNoteStatus").textContent = "저장됨";
        renderSidebar();
      }, 400);
    });
    function syncMobileViewport() {
      if (!window.matchMedia("(max-width: 720px)").matches) {
        document.documentElement.style.setProperty("--app-height", "100vh");
        return;
      }
      const height = Math.round(window.innerHeight || document.documentElement.clientHeight);
      document.documentElement.style.setProperty("--app-height", `${height}px`);
    }
    syncMobileViewport();
    window.addEventListener("orientationchange", () => setTimeout(syncMobileViewport, 250));
    window.addEventListener("resize", () => {
      if (!window.matchMedia("(max-width: 720px)").matches) syncMobileViewport();
    });
    window.addEventListener("online", () => {
      if (pendingRemoteSync) {
        setSyncStatus("재동기화 중");
        initializeSupabase();
      }
    });
    $("#settingsBtn").onclick = openSettings;
    $("#addProjectBtn").onclick = openProjectModal;
    $("#mobileAddProjectBtn").onclick = openProjectModal;
    $("#projectTitle").onclick = openProjectDetail;
    $("#formModal").addEventListener("click", async e => {
      if (e.target.id === "createProjectBtn") {
        const name = $("#newProjectName").value.trim(); if (!name) return toast("프로젝트 이름을 입력해주세요");
        const id = crypto.randomUUID(); state.projects.push({ id, name, desc: $("#newProjectDesc").value.trim() || "Shared project", color: $("#newProjectColor").value }); state.activeProject = id; state.activeView = "project"; saveState(true); $("#formModal").classList.add("hidden"); render();
      }
      if (e.target.id === "saveProjectDetailBtn") {
        const project = currentProject();
        const password = $("#formModalContent").dataset.notePassword;
        project.encryptedNote = await encryptProjectNote($("#encryptedProjectNote").value, password);
        delete project.details;
        saveState(true); $("#formModal").classList.add("hidden"); render(); toast("암호화 노트를 저장했습니다");
      }
      if (e.target.id === "saveSettingsBtn") {
        $$("[data-name-setting]").forEach(x => state.users[x.dataset.nameSetting].name = x.value.trim() || state.users[x.dataset.nameSetting].name);
        $$("[data-color-setting]").forEach(x => state.users[x.dataset.colorSetting].color = x.value);
        applyTheme($("#themeSetting").value);
        state.settings.showNames = $("#showNamesSetting").checked; saveState(true); $("#formModal").classList.add("hidden"); render(); toast("설정을 저장했습니다");
      }
    });
    $("#lightbox").onclick = () => $("#lightbox").classList.add("hidden");
    applyTheme(deviceTheme);
    render();
    if (!state.activeUser) $("#userModal").classList.remove("hidden");
    initializeSupabase();
  </script>
</body>
