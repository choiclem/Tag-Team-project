<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Devlog Duo</title>
  <meta name="app-version" content="2026.06.12.2">
  <style>
    :root {
      --bg: #f4f4ef;
      --panel: rgba(255,255,255,.84);
      --ink: #18201b;
      --muted: #778078;
      --line: #dedfd8;
      --accent: #1d6b4b;
      --accent-soft: #dcebe2;
      --shadow: 0 18px 50px rgba(32,42,35,.08);
      --radius: 18px;
      --app-height: 100vh;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink); background:
      radial-gradient(circle at 8% 0%, #e4eadc 0, transparent 29%),
      radial-gradient(circle at 96% 94%, #e7ded1 0, transparent 30%), var(--bg);
      font-family: Inter, "Noto Sans KR", system-ui, sans-serif;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .app { display: grid; grid-template-columns: 250px minmax(420px, 1fr) 320px; gap: 14px; padding: 14px; height: 100vh; }
    .panel { background: var(--panel); border: 1px solid rgba(255,255,255,.9); border-radius: var(--radius); box-shadow: var(--shadow); backdrop-filter: blur(16px); min-height: 0; }
    .sidebar, .rightbar { padding: 18px; overflow: auto; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; background: var(--ink); color: white; border-radius: 11px; font-weight: 800; }
    .brand strong { display: block; letter-spacing: -.04em; }
    .brand small { color: var(--muted); }
    .user-switcher { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px; }
    .user-switch { border: 1px solid var(--line); background: white; border-radius: 10px; padding: 8px 5px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 700; }
    .user-switch.active { border-color: var(--user-color); background: color-mix(in srgb, var(--user-color) 12%, white); color: var(--user-color); }
    .user-switch .dot { width: 7px; height: 7px; }
    .section-title { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 22px 8px 8px; }
    .nav-item, .project-item { width: 100%; border: 0; background: transparent; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 11px; text-align: left; }
    .nav-item:hover, .nav-item.active, .project-item:hover, .project-item.active { background: #edf0e9; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .nav-item span:nth-child(2), .project-item span:nth-child(2) { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .count { color: var(--muted); font-size: 11px; }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 11px; background: #edf0e9; border-radius: 13px; margin-top: 16px; }
    .avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: white; font-weight: 800; flex: 0 0 auto; }
    .user-card div:nth-child(2) { min-width: 0; flex: 1; }
    .user-card strong, .user-card small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-card small { color: var(--muted); font-size: 11px; }
    .icon-btn { width: 34px; height: 34px; border: 1px solid var(--line); background: white; border-radius: 10px; display: grid; place-items: center; }
    .main { display: flex; flex-direction: column; overflow: hidden; }
    .mobile-bar { display: none; }
    .topbar { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
    .topline { display: flex; align-items: center; gap: 10px; }
    .project-heading { min-width: 0; flex: 1; }
    .project-heading h1 { font-size: 21px; margin: 0 0 3px; letter-spacing: -.04em; }
    .project-heading p { margin: 0; color: var(--muted); font-size: 12px; }
    .search { position: relative; width: 150px; flex: 0 0 auto; }
    .search input { width: 100%; padding: 7px 10px 7px 35px; border: 1px solid var(--line); background: rgba(255,255,255,.7); border-radius: 9px; outline: none; font-size: 11px; }
    .search span { position: absolute; left: 11px; top: 3px; color: var(--muted); font-size: 22px; line-height: 28px; font-weight: 700; pointer-events: none; }
    .filter-row { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
    .chip { border: 1px solid var(--line); background: white; border-radius: 999px; padding: 5px 10px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .chip.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .feed { flex: 1; overflow: auto; padding: 20px; }
    .personal-note-view { flex: 1; overflow: auto; padding: 28px; background: rgba(255,255,255,.34); }
    .personal-note-card { max-width: 760px; min-height: 100%; margin: 0 auto; padding: 24px; background: #fffdf3; border: 1px solid #e3dfc9; border-radius: 16px; box-shadow: 0 16px 40px rgba(44,42,27,.06); }
    .personal-note-card h2 { margin: 0 0 5px; font-size: 18px; letter-spacing: -.04em; }
    .personal-note-card p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .personal-note-editor { width: 100%; min-height: calc(100vh - 245px); resize: none; border: 0; outline: 0; background: transparent; line-height: 1.8; font-size: 14px; }
    .personal-note-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 9px; margin-bottom: 15px; }
    .personal-note-image { position: relative; }
    .personal-note-image img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; cursor: zoom-in; }
    .personal-note-image button { position: absolute; top: 5px; right: 5px; width: 23px; height: 23px; border: 0; border-radius: 50%; background: rgba(20,26,22,.8); color: white; }
    .empty { max-width: 380px; margin: 80px auto; text-align: center; color: var(--muted); }
    .empty b { color: var(--ink); display: block; margin-bottom: 7px; }
    .entry { display: grid; grid-template-columns: 38px 1fr; gap: 10px; margin-bottom: 13px; }
    .entry-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    .entry-name { font-weight: 800; font-size: 13px; }
    .source-label { padding: 2px 6px; border-radius: 6px; background: #edf0e9; color: var(--muted); font-size: 9px; font-weight: 800; }
    .entry-time { color: var(--muted); font-size: 10px; }
    .pin { color: #c58b28; font-size: 11px; }
    .entry-actions { margin-left: auto; opacity: 0; transition: opacity .2s; }
    .entry:hover .entry-actions { opacity: 1; }
    .entry-actions button { border: 0; background: transparent; color: var(--muted); font-size: 11px; }
    .bubble { background: color-mix(in srgb, var(--writer-color) 7%, white); border: 1px solid color-mix(in srgb, var(--writer-color) 14%, var(--line)); padding: 12px 14px; border-radius: 5px 15px 15px 15px; line-height: 1.55; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
    .bubble img { display: block; max-width: min(100%, 520px); max-height: 380px; object-fit: cover; border-radius: 10px; margin-top: 10px; cursor: zoom-in; }
    .status { padding: 3px 7px; border-radius: 99px; background: #fff0d7; color: #8b5d13; font-size: 10px; }
    .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; background: rgba(255,255,255,.45); }
    .preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .preview-item { position: relative; display: inline-block; }
    .preview img { width: 88px; height: 65px; object-fit: cover; border-radius: 8px; }
    .preview button { position: absolute; top: -6px; right: -6px; border: 0; background: var(--ink); color: white; border-radius: 50%; width: 20px; height: 20px; }
    .composer textarea { width: 100%; min-height: 70px; max-height: 170px; resize: vertical; border: 1px solid var(--line); background: white; border-radius: 13px; padding: 12px; outline: none; }
    .compose-tools { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
    .compose-tools select { border: 1px solid var(--line); border-radius: 8px; background: white; padding: 7px 8px; font-size: 11px; min-width: 0; }
    .send { margin-left: auto; border: 0; background: var(--ink); color: white; border-radius: 9px; padding: 8px 14px; font-weight: 700; font-size: 12px; }
    .rightbar h2 { font-size: 15px; margin: 0; letter-spacing: -.03em; }
    .rightbar { position: relative; padding-bottom: 58px; }
    .right-section { margin-bottom: 24px; }
    .right-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .note-area { width: 100%; min-height: 160px; resize: vertical; border: 1px solid #d9d8cc; background: #fffdf3; border-radius: 13px; padding: 13px; line-height: 1.6; outline: none; box-shadow: inset 0 -20px 0 rgba(246,232,167,.08); }
    .note-hint { font-size: 10px; color: var(--muted); margin-top: 5px; }
    .shared-project { width: 100%; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); background: white; padding: 10px; border-radius: 11px; margin-bottom: 7px; text-align: left; }
    .shared-project.active { border-color: var(--accent); background: var(--accent-soft); }
    .shared-project-wrap { position: relative; }
    .shared-project-wrap .shared-project { padding-right: 35px; }
    .delete-project { position: absolute; top: 8px; right: 7px; width: 25px; height: 25px; border: 0; background: transparent; color: var(--muted); border-radius: 7px; opacity: .45; }
    .delete-project:hover { opacity: 1; color: #a33; background: #f7e7e4; }
    .folder-icon { font-size: 17px; }
    .shared-project strong { display: block; font-size: 12px; }
    .shared-project small { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .add-project { width: 100%; border: 1px dashed #b9beb8; background: transparent; color: var(--muted); padding: 9px; border-radius: 10px; }
    .sync-indicator { position: absolute; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.85); color: var(--muted); font-size: 9px; }
    .sync-indicator::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #56a373; }
    .modal-wrap { position: fixed; inset: 0; background: rgba(20,26,22,.48); display: grid; place-items: center; padding: 18px; z-index: 20; backdrop-filter: blur(7px); }
    .modal { width: min(450px, 100%); background: #fbfcf8; border-radius: 20px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
    .modal h2 { margin: 0 0 5px; letter-spacing: -.04em; }
    .modal > p { color: var(--muted); margin: 0 0 18px; font-size: 12px; line-height: 1.6; }
    .user-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .user-choice button { border: 1px solid var(--line); background: white; padding: 18px; border-radius: 14px; }
    .user-choice .avatar { margin: 0 auto 8px; width: 42px; height: 42px; }
    .form-group { margin: 14px 0; }
    .form-group label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; border: 1px solid var(--line); background: white; padding: 9px; border-radius: 9px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 17px; }
    .btn { border: 1px solid var(--line); background: white; padding: 8px 12px; border-radius: 9px; }
    .btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
    .settings-users { display: grid; gap: 10px; }
    .settings-row { display: grid; grid-template-columns: 1fr 50px; gap: 8px; }
    .sync-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 9px 14px; border-radius: 99px; font-size: 11px; z-index: 50; }
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: grid; place-items: center; z-index: 60; padding: 30px; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    @media (max-width: 1050px) { .app { grid-template-columns: 220px 1fr; } .rightbar { display: none; } }
    @media (max-width: 720px) {
      body { background: #f4f4ef; }
      .app { display: block; padding: 0; height: var(--app-height); }
      .sidebar, .rightbar, .topbar { display: none; }
      .main { height: var(--app-height); border: 0; border-radius: 0; box-shadow: none; }
      .mobile-bar { display: flex; align-items: center; gap: 8px; padding: max(9px, env(safe-area-inset-top)) 10px 9px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); }
      .mobile-bar select { min-width: 0; border: 1px solid var(--line); background: white; border-radius: 10px; padding: 9px 8px; font-size: 12px; font-weight: 700; }
      #mobileProjectSelect { flex: 1; }
      #mobileUserSelect { width: 88px; color: var(--accent); }
      .mobile-title { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: var(--ink); color: white; font-size: 10px; font-weight: 900; flex: 0 0 auto; }
      .feed { padding: 14px 10px; }
      .personal-note-view { padding: 10px; }
      .personal-note-card { padding: 15px; border-radius: 12px; }
      .personal-note-editor { min-height: calc(var(--app-height) - 155px); }
      .entry { grid-template-columns: 27px minmax(0, 1fr); gap: 8px; margin-bottom: 10px; }
      .entry .avatar { width: 27px; height: 27px; font-size: 9px; }
      .entry-head { margin-bottom: 4px; } .entry-time { font-size: 9px; } .entry-actions { display: none; }
      .bubble { padding: 10px 11px; border-radius: 4px 13px 13px 13px; font-size: 13px; }
      .bubble img { max-height: 260px; margin-top: 8px; }
      .composer { padding: 8px 9px max(9px, env(safe-area-inset-bottom)); flex: 0 0 auto; background: white; }
      .composer textarea { min-height: 48px; max-height: 100px; padding: 10px; border-radius: 11px; }
      .compose-tools { display: grid; grid-template-columns: 34px 94px 1fr; gap: 6px; margin-top: 6px; }
      .compose-tools select { width: 94px; padding: 7px 4px; }
      .send { margin-left: 0; width: 100%; padding: 8px; }
      .preview { max-height: 72px; overflow-x: auto; flex-wrap: nowrap; padding-top: 5px; }
      .preview img { width: 72px; height: 54px; }
      .empty { margin: 50px auto; padding: 0 20px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel sidebar">
      <div class="brand"><div class="brand-mark">&lt;/&gt;</div><div><strong>Devlog Duo</strong><small>Build, note, share.</small></div></div>
      <div class="user-switcher" id="userSwitcher"></div>
      <button class="nav-item" id="announcementButton" data-announcements><span>📌</span><span>공동 노트</span><span class="count" id="announcementCount">0</span></button>
      <div class="section-title">Project folders</div>
      <div id="sidebarProjects"></div>
      <div class="section-title">Personal folders</div>
      <div id="personalFolders"></div>
      <div class="section-title">Views</div>
      <button class="nav-item" data-view="today"><span>◷</span><span>Today's updates</span><span class="count" id="todayCount">0</span></button>
      <button class="nav-item" data-view="pinned"><span>★</span><span>Pinned updates</span><span class="count" id="pinnedCount">0</span></button>
      <button class="nav-item" data-view="all"><span>⌘</span><span>All activity</span><span class="count" id="allCount">0</span></button>
      <div class="user-card">
        <div class="avatar" id="activeAvatar">C</div>
        <div><strong id="activeName">Clem</strong><small>Current writer</small></div>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
      </div>
    </aside>

    <main class="panel main">
      <div class="mobile-bar">
        <div class="mobile-title">&lt;/&gt;</div>
        <select id="mobileProjectSelect" aria-label="프로젝트 선택"></select>
        <select id="mobileUserSelect" aria-label="작성자 선택"></select>
      </div>
      <header class="topbar">
        <div class="topline">
          <div class="project-heading"><h1 id="projectTitle">Loading...</h1><p id="projectSubtitle">Shared development journal</p></div>
          <div class="search"><span>⌕</span><input id="searchInput" placeholder="Search"></div>
        </div>
        <div class="filter-row" id="filterRow"></div>
      </header>
      <section class="feed" id="feed"></section>
      <section class="personal-note-view hidden" id="personalNoteView">
        <div class="personal-note-card">
          <h2 id="personalNoteTitle">Personal note</h2>
          <div class="personal-note-images hidden" id="personalNoteImages"></div>
          <textarea class="personal-note-editor" id="personalNoteEditor" placeholder="생각나는 내용을 자유롭게 적으세요..."></textarea>
        </div>
      </section>
      <section class="composer">
        <div id="imagePreview" class="preview hidden"></div>
        <textarea id="messageInput" aria-label="메시지 작성"></textarea>
        <div class="compose-tools">
          <button class="icon-btn" id="imageBtn" title="사진 첨부">＋</button>
          <input class="hidden" type="file" accept="image/*" multiple id="imageInput">
          <select id="statusInput"><option>Progress</option><option>Done</option><option>Blocked</option><option>Idea</option><option>Bug</option></select>
          <button class="send" id="sendBtn">Post update</button>
        </div>
      </section>
    </main>

    <aside class="panel rightbar">
      <section class="right-section">
        <div class="right-head"><h2>Shared projects</h2><span class="count" id="projectCount"></span></div>
        <div id="sharedProjects"></div>
        <button class="add-project" id="addProjectBtn">＋ Add project folder</button>
      </section>
      <div class="sync-indicator" id="syncStatus" title="Supabase 실시간 공유 · Clem과 Ryan의 모바일·PC에서 기록을 자동 공유합니다.">연결 확인 중</div>
    </aside>
  </div>

  <div class="modal-wrap hidden" id="userModal">
    <div class="modal"><h2>누가 기록하나요?</h2><p>처음 사용할 작성자를 선택하세요. 이후에는 왼쪽 위 Clem / Ryan 버튼으로 바로 전환할 수 있습니다.</p><div class="user-choice" id="userChoices"></div></div>
  </div>
  <div class="modal-wrap hidden" id="formModal"><div class="modal" id="formModalContent"></div></div>
  <div class="toast hidden" id="toast"></div>
  <div class="lightbox hidden" id="lightbox"><img alt="Attached preview"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const STORE_KEY = "devlog-duo-v1";
    const REMOTE_ROW_ID = "shared";
    let supabaseClient = null;
    let remoteSaveTimer = null;
    let applyingRemoteState = false;
    const seed = {
      users: {
        clem: { id: "clem", name: "Clem", color: "#2f7d5b", note: "- 오늘 확인할 PR\\n- API 에러 로그 정리" },
        ryan: { id: "ryan", name: "Ryan", color: "#8a5a9d", note: "- 배포 전 체크리스트\\n- UI 간격 다시 보기" }
      },
      projects: [{ id: "general", name: "General", desc: "Shared project", color: "#4d82a8" }],
      entries: [],
      activeUser: null, activeProject: "general", activeView: "project", settings: { showNames: true }, dataVersion: 2
    };
    let state = loadState();
    let pendingImages = [];
    let activeFilter = "All";

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const escapeHtml = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY));
        if (!saved) return structuredClone(seed);
        const merged = { ...seed, ...saved, settings: { ...seed.settings, ...saved.settings } };
        if (!saved.dataVersion) {
          const sampleIds = new Set(["launch", "website", "lab"]);
          const sampleTexts = new Set([
            "로그인 플로우 정리 완료. 이메일 인증 후 온보딩 화면으로 바로 연결되도록 수정했습니다.",
            "모바일에서 버튼이 화면 아래로 밀리는 이슈 발견. 내일 오전에 safe-area 포함해서 수정할게요.",
            "새 컬러 팔레트와 카드 컴포넌트 초안 추가. 밝은 배경에서도 대비가 충분한지 확인 필요."
          ]);
          const untouchedSample = merged.projects.length === 3
            && merged.projects.every(p => sampleIds.has(p.id))
            && merged.entries.length === 3
            && merged.entries.every(e => sampleTexts.has(e.text));
          if (untouchedSample) {
            merged.projects = structuredClone(seed.projects);
            merged.entries = [];
            merged.activeProject = seed.activeProject;
          }
          merged.dataVersion = 2;
          localStorage.setItem(STORE_KEY, JSON.stringify(merged));
        }
        return merged;
      } catch { return structuredClone(seed); }
    }
    function saveState(syncRemote = false) {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        if (syncRemote && !applyingRemoteState) scheduleRemoteSave();
        return true;
      } catch {
        toast("저장 공간이 부족합니다. 오래된 사진 기록을 삭제해주세요");
        return false;
      }
    }
    function sharedSnapshot() {
      return {
        users: state.users,
        projects: state.projects,
        entries: state.entries,
        settings: state.settings,
        dataVersion: state.dataVersion
      };
    }
    function applySharedState(shared) {
      if (!shared) return;
      applyingRemoteState = true;
      state = {
        ...state,
        users: shared.users || state.users,
        projects: shared.projects || state.projects,
        entries: shared.entries || [],
        settings: { ...state.settings, ...(shared.settings || {}) },
        dataVersion: shared.dataVersion || state.dataVersion
      };
      if (!state.projects.some(p => p.id === state.activeProject)) state.activeProject = state.projects[0]?.id;
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      applyingRemoteState = false;
      render();
    }
    function setSyncStatus(text) {
      const status = $("#syncStatus");
      if (status) status.textContent = text;
    }
    function scheduleRemoteSave() {
      if (!supabaseClient) return;
      clearTimeout(remoteSaveTimer);
      setSyncStatus("저장 중");
      remoteSaveTimer = setTimeout(syncToSupabase, 300);
    }
    async function syncToSupabase() {
      if (!supabaseClient) return;
      const { error } = await supabaseClient.from("app_state").upsert({
        id: REMOTE_ROW_ID,
        data: sharedSnapshot(),
        updated_at: new Date().toISOString()
      });
      setSyncStatus(error ? "동기화 오류" : "동기화됨");
      if (error) console.error("Supabase sync failed", error);
    }
    async function initializeSupabase() {
      const config = window.DEVLOG_SUPABASE || {};
      if (!config.url || !config.anonKey || !window.supabase?.createClient) {
        setSyncStatus("설정 필요");
        return;
      }
      supabaseClient = window.supabase.createClient(config.url, config.anonKey);
      setSyncStatus("연결 중");
      const { data, error } = await supabaseClient.from("app_state").select("data").eq("id", REMOTE_ROW_ID).maybeSingle();
      if (error) {
        setSyncStatus("연결 오류");
        console.error("Supabase load failed", error);
        return;
      }
      if (data?.data) applySharedState(data.data);
      else await syncToSupabase();
      supabaseClient.channel("devlog-duo-state")
        .on("postgres_changes", { event: "*", schema: "public", table: "app_state", filter: `id=eq.${REMOTE_ROW_ID}` }, payload => {
          if (payload.new?.data) applySharedState(payload.new.data);
          setSyncStatus("동기화됨");
        })
        .subscribe(status => {
          if (status === "SUBSCRIBED") setSyncStatus("실시간 연결됨");
        });
    }
    function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add("hidden"), 1800); }
    function initials(name) { return name.trim().split(/\s+/).map(x => x[0]).join("").slice(0,2).toUpperCase(); }
    function formatTime(ts) { return new Intl.DateTimeFormat("ko-KR", { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }).format(ts); }
    function isToday(ts) {
      const date = new Date(ts);
      const today = new Date();
      return date.getFullYear() === today.getFullYear()
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    }
    function activeUser() { return state.users[state.activeUser] || state.users.clem; }
    function currentProject() { return state.projects.find(p => p.id === state.activeProject) || state.projects[0]; }

    function render() {
      renderSidebar(); renderHeader(); renderFeed(); renderRightbar(); renderUserChoices(); renderMobileBar();
      const u = activeUser();
      $("#activeAvatar").textContent = initials(u.name); $("#activeAvatar").style.background = u.color;
      $("#activeName").textContent = u.name;
      renderPersonalNote();
    }
    function renderSidebar() {
      $("#userSwitcher").innerHTML = Object.values(state.users).map(u => `<button class="user-switch ${state.activeUser === u.id ? "active" : ""}" style="--user-color:${u.color}" data-choose-user="${u.id}"><span class="dot" style="background:${u.color}"></span>${escapeHtml(u.name)}</button>`).join("");
      $("#announcementButton").classList.toggle("active", state.activeView === "announcements");
      $$("[data-view]").forEach(button => button.classList.toggle("active", state.activeView === button.dataset.view));
      $("#announcementCount").textContent = state.entries.filter(e => e.projectId === "__announcements__").length;
      $("#personalFolders").innerHTML = Object.values(state.users).map(u => {
        return `<button class="nav-item ${state.activeView === "personalNote" && state.noteUser === u.id ? "active" : ""}" data-personal-note="${u.id}"><span class="dot" style="background:${u.color}"></span><span>${escapeHtml(u.name)} 개인 노트</span></button>`;
      }).join("");
      $("#sidebarProjects").innerHTML = state.projects.map(p => {
        const count = state.entries.filter(e => e.projectId === p.id).length;
        return `<button class="project-item ${state.activeView === "project" && p.id === state.activeProject ? "active" : ""}" data-project="${p.id}"><span class="folder-icon" style="color:${p.color}">▰</span><span>${escapeHtml(p.name)}</span><span class="count">${count}</span></button>`;
      }).join("");
      $("#pinnedCount").textContent = state.entries.filter(e => e.pinned).length;
      $("#todayCount").textContent = state.entries.filter(e => isToday(e.createdAt)).length;
      $("#allCount").textContent = state.entries.length;
    }
    function renderMobileBar() {
      const projectOptions = state.projects.map(p => `<option value="project:${p.id}" ${state.activeView === "project" && p.id === state.activeProject ? "selected" : ""}>${escapeHtml(p.name)}</option>`).join("");
      const noteOptions = Object.values(state.users).map(u => `<option value="note:${u.id}" ${state.activeView === "personalNote" && state.noteUser === u.id ? "selected" : ""}>${escapeHtml(u.name)} 개인 노트</option>`).join("");
      $("#mobileProjectSelect").innerHTML = `<option value="announcements" ${state.activeView === "announcements" ? "selected" : ""}>📌 공동 노트</option><option value="today" ${state.activeView === "today" ? "selected" : ""}>◷ Today's updates</option><optgroup label="프로젝트">${projectOptions}</optgroup><optgroup label="개인 노트">${noteOptions}</optgroup>`;
      $("#mobileUserSelect").innerHTML = Object.values(state.users).map(u => `<option value="${u.id}" ${u.id === state.activeUser ? "selected" : ""}>${escapeHtml(u.name)}</option>`).join("");
      $("#mobileUserSelect").style.color = activeUser().color;
    }
    function renderHeader() {
      const project = currentProject();
      const labels = { project: project.name, announcements: "공동 노트", today: "Today's updates", all: "All activity", pinned: "Pinned updates", personalNote: `${state.users[state.noteUser]?.name || ""} 개인 노트` };
      $("#projectTitle").textContent = labels[state.activeView] || project.name;
      $("#projectSubtitle").textContent = state.activeView === "announcements" ? "함께 기록하는 노트" : state.activeView === "personalNote" ? "Private thoughts and ideas" : state.activeView === "project" ? project.desc : "Filtered development journal";
      $("#searchInput").closest(".search").classList.toggle("hidden", state.activeView === "personalNote");
      $("#filterRow").classList.toggle("hidden", state.activeView === "personalNote");
      const filters = ["All", "Progress", "Done", "Blocked", "Idea", "Bug"];
      $("#filterRow").innerHTML = filters.map(f => `<button class="chip ${activeFilter === f ? "active" : ""}" data-filter="${f}">${f}</button>`).join("");
    }
    function getVisibleEntries() {
      let list = [...state.entries];
      if (state.activeView === "project") list = list.filter(e => e.projectId === state.activeProject);
      if (state.activeView === "announcements") list = list.filter(e => e.projectId === "__announcements__");
      if (state.activeView === "today") list = list.filter(e => isToday(e.createdAt));
      if (state.activeView === "pinned") list = list.filter(e => e.pinned);
      if (activeFilter !== "All") list = list.filter(e => e.status === activeFilter);
      const q = $("#searchInput").value.trim().toLowerCase();
      if (q) list = list.filter(e => `${e.text} ${e.status} ${state.users[e.userId]?.name}`.toLowerCase().includes(q));
      return list.sort((a,b) => Number(b.pinned) - Number(a.pinned) || a.createdAt - b.createdAt);
    }
    function renderFeed() {
      const personal = state.activeView === "personalNote";
      $("#feed").classList.toggle("hidden", personal);
      $(".composer").classList.toggle("hidden", personal);
      $("#personalNoteView").classList.toggle("hidden", !personal);
      if (personal) return;
      const entries = getVisibleEntries();
      if (!entries.length) { $("#feed").innerHTML = `<div class="empty"><b>아직 기록이 없습니다.</b>첫 개발 업데이트를 남겨보세요. 짧아도 충분합니다.</div>`; return; }
      const grouped = entries.reduce((groups, entry) => {
        const previous = groups[groups.length - 1];
        if (previous && previous.userId === entry.userId && previous.projectId === entry.projectId && entry.createdAt - previous.createdAt <= 60000) {
          previous.items.push(entry);
          previous.text = previous.items.map(item => item.text).filter(Boolean).join("\n");
          previous.images = previous.items.flatMap(item => [...(item.images || []), ...(item.image ? [item.image] : [])]);
          previous.status = entry.status;
          previous.createdAt = entry.createdAt;
          previous.lastId = entry.id;
          return groups;
        }
        groups.push({ ...entry, items: [entry], images: [...(entry.images || []), ...(entry.image ? [entry.image] : [])], lastId: entry.id });
        return groups;
      }, []);
      $("#feed").innerHTML = grouped.map(e => {
        const u = state.users[e.userId] || { name: "Unknown", color: "#777" };
        const source = e.projectId === "__announcements__" ? "공동 노트" : state.projects.find(p => p.id === e.projectId)?.name || "Unknown project";
        return `<article class="entry" style="--writer-color:${u.color}">
          <div class="avatar" style="background:${u.color}">${initials(u.name)}</div>
          <div><div class="entry-head">
            ${state.settings.showNames ? `<span class="entry-name" style="color:${u.color}">${escapeHtml(u.name)}</span>` : ""}
            ${state.activeView === "today" ? `<span class="source-label">${escapeHtml(source)}</span>` : ""}
            <span class="status">${escapeHtml(e.status)}</span>
            <span class="entry-time">${formatTime(e.createdAt)}</span>${e.pinned ? `<span class="pin">★ pinned</span>` : ""}
            <span class="entry-actions"><button data-pin="${e.lastId}">${e.pinned ? "Unpin" : "Pin"}</button><button data-delete-group="${e.items.map(item => item.id).join(",")}">Delete</button></span>
          </div><div class="bubble">${escapeHtml(e.text)}${e.images.map(src => `<img src="${src}" alt="Attached image">`).join("")}</div>
          </div>
        </article>`;
      }).join("");
      $("#feed").scrollTop = $("#feed").scrollHeight;
    }
    function renderPersonalNote() {
      const user = state.users[state.noteUser] || activeUser();
      $("#personalNoteTitle").textContent = `${user.name} 개인 노트`;
      $("#personalNoteEditor").value = user.personalNote || "";
      const images = user.personalImages || [];
      $("#personalNoteImages").innerHTML = images.map((src, i) => `<div class="personal-note-image"><img src="${src}" alt="개인 노트 이미지"><button data-delete-note-image="${i}">×</button></div>`).join("");
      $("#personalNoteImages").classList.toggle("hidden", !images.length);
    }
    function renderRightbar() {
      $("#projectCount").textContent = `${state.projects.length} folders`;
      $("#sharedProjects").innerHTML = state.projects.map(p => {
        const count = state.entries.filter(e => e.projectId === p.id).length;
        return `<div class="shared-project-wrap"><button class="shared-project ${state.activeView === "project" && p.id === state.activeProject ? "active" : ""}" data-project="${p.id}">
          <span class="folder-icon" style="color:${p.color}">▰</span><span><strong>${escapeHtml(p.name)}</strong><small>${count} updates · ${escapeHtml(p.desc)}</small></span></button>
          <button class="delete-project" data-delete-project="${p.id}" title="프로젝트 삭제">×</button></div>`;
      }).join("");
    }
    function deleteProject(id) {
      if (state.projects.length <= 1) return toast("프로젝트는 최소 한 개가 필요합니다");
      const project = state.projects.find(p => p.id === id);
      const count = state.entries.filter(e => e.projectId === id).length;
      if (!project || !confirm(`"${project.name}" 프로젝트와 기록 ${count}개를 모두 삭제할까요?\n\n삭제 비밀번호: 1234`)) return;
      if (prompt("삭제 비밀번호 1234를 입력하세요") !== "1234") return toast("비밀번호가 맞지 않아 삭제하지 않았습니다");
      state.projects = state.projects.filter(p => p.id !== id);
      state.entries = state.entries.filter(e => e.projectId !== id);
      if (state.activeProject === id) state.activeProject = state.projects[0].id;
      state.activeView = "project";
      saveState(true); render(); toast("프로젝트를 삭제했습니다");
    }
    function renderUserChoices() {
      $("#userChoices").innerHTML = Object.values(state.users).map(u => `<button data-choose-user="${u.id}"><span class="avatar" style="background:${u.color}">${initials(u.name)}</span><strong>${escapeHtml(u.name)}</strong></button>`).join("");
    }
    function chooseUser(id) { state.activeUser = id; saveState(); $("#userModal").classList.add("hidden"); render(); toast(`${state.users[id].name}으로 전환했습니다`); }
    function postEntry() {
      const text = $("#messageInput").value.trim();
      if (!text && !pendingImages.length) return toast("내용 또는 사진을 추가해주세요");
      const targetView = state.activeView === "announcements" ? "announcements" : "project";
      const entry = { id: crypto.randomUUID(), projectId: targetView === "announcements" ? "__announcements__" : state.activeProject, userId: state.activeUser, text, images: [...pendingImages], status: $("#statusInput").value, pinned: targetView === "announcements", createdAt: Date.now() };
      state.entries.push(entry);
      state.activeView = targetView;
      activeFilter = "All";
      $("#searchInput").value = "";
      if (!saveState(true)) {
        state.entries = state.entries.filter(e => e.id !== entry.id);
        return;
      }
      $("#messageInput").value = "";
      pendingImages = [];
      renderImagePreview();
      render();
      toast("개발일지를 등록했습니다");
    }
    function renderImagePreview() {
      const box = $("#imagePreview");
      box.innerHTML = pendingImages.map((src, i) => `<span class="preview-item"><img src="${src}" alt="첨부 미리보기"><button data-remove-image="${i}">×</button></span>`).join("");
      box.classList.toggle("hidden", !pendingImages.length);
    }
    function compressImage(file) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => {
          const image = new Image();
          image.onload = () => {
            const max = 1600;
            const scale = Math.min(1, max / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const context = canvas.getContext("2d");
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", .82));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
    async function addImageFiles(files) {
      const images = [...files].filter(file => file.type.startsWith("image/"));
      for (const file of images) {
        const compressed = await compressImage(file);
        pendingImages.push(compressed);
        renderImagePreview();
      }
      if (images.length) toast("사진을 첨부했습니다");
    }
    async function addPersonalNoteImages(files) {
      const images = [...files].filter(file => file && file.type.startsWith("image/"));
      if (!images.length) return;
      const user = state.users[state.noteUser] || activeUser();
      user.personalImages ||= [];
      for (const file of images) user.personalImages.push(await compressImage(file));
      if (!saveState(true)) return;
      renderPersonalNote();
      toast("개인 노트에 사진을 추가했습니다");
    }
    function openProjectModal() {
      $("#formModalContent").innerHTML = `<h2>새 공유 프로젝트</h2><p>프로젝트별로 개발일지를 나눠 관리할 수 있습니다.</p>
        <div class="form-group"><label>Project name</label><input id="newProjectName" placeholder="예: Mobile App v2"></div>
        <div class="form-group"><label>Description</label><input id="newProjectDesc" placeholder="무엇을 만드는 프로젝트인가요?"></div>
        <div class="form-group"><label>Folder color</label><input id="newProjectColor" type="color" value="#4d82a8"></div>
        <div class="form-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="createProjectBtn">Create folder</button></div>`;
      $("#formModal").classList.remove("hidden");
    }
    function openSettings() {
      const users = Object.values(state.users);
      $("#formModalContent").innerHTML = `<h2>Settings</h2><p>작성자 이름과 글 색상, 표시 방식을 설정하고 데이터를 관리합니다.</p>
        <div class="settings-users">${users.map(u => `<div class="settings-row"><input data-name-setting="${u.id}" value="${escapeHtml(u.name)}"><input data-color-setting="${u.id}" type="color" value="${u.color}"></div>`).join("")}</div>
        <div class="form-group"><label><input type="checkbox" id="showNamesSetting" ${state.settings.showNames ? "checked" : ""}> 글 옆에 작성자 이름 표시</label></div>
        <div class="form-actions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="saveSettingsBtn">Save settings</button></div>`;
      $("#formModal").classList.remove("hidden");
    }
    document.addEventListener("click", e => {
      const t = e.target.closest("button, img");
      if (!t) return;
      if (t.dataset.chooseUser) chooseUser(t.dataset.chooseUser);
      if (t.dataset.announcements !== undefined) { state.activeView = "announcements"; saveState(); render(); }
      if (t.dataset.project) { state.activeProject = t.dataset.project; state.activeView = "project"; saveState(); render(); }
      if (t.dataset.deleteProject) deleteProject(t.dataset.deleteProject);
      if (t.dataset.personalNote) { state.noteUser = t.dataset.personalNote; state.activeView = "personalNote"; saveState(); render(); }
      if (t.dataset.view) { state.activeView = t.dataset.view; render(); }
      if (t.dataset.filter) { activeFilter = t.dataset.filter; renderHeader(); renderFeed(); }
      if (t.dataset.pin) { const x = state.entries.find(x => x.id === t.dataset.pin); x.pinned = !x.pinned; saveState(true); render(); }
      if (t.dataset.delete && confirm("이 기록을 삭제할까요?")) { state.entries = state.entries.filter(x => x.id !== t.dataset.delete); saveState(true); render(); }
      if (t.dataset.deleteGroup && confirm("묶인 기록을 모두 삭제할까요?")) { const ids = t.dataset.deleteGroup.split(","); state.entries = state.entries.filter(x => !ids.includes(x.id)); saveState(true); render(); }
      if (t.dataset.deleteNoteImage !== undefined) {
        const user = state.users[state.noteUser] || activeUser();
        user.personalImages.splice(Number(t.dataset.deleteNoteImage), 1);
        saveState(true); renderPersonalNote();
      }
      if (t.dataset.closeModal !== undefined || t.id === "formModal") $("#formModal").classList.add("hidden");
      if (t.matches(".bubble img, .personal-note-image img")) { $("#lightbox img").src = t.src; $("#lightbox").classList.remove("hidden"); }
    });
    $("#sendBtn").onclick = postEntry;
    $("#messageInput").addEventListener("keydown", e => {
      if (e.key !== "Enter" || e.shiftKey || e.isComposing) return;
      e.preventDefault();
      postEntry();
    });
    $("#searchInput").addEventListener("input", renderFeed);
    $("#mobileProjectSelect").addEventListener("change", e => {
      const [type, id] = e.target.value.split(":");
      if (type === "announcements") state.activeView = "announcements";
      else if (type === "today") state.activeView = "today";
      else if (type === "note") { state.noteUser = id; state.activeView = "personalNote"; }
      else { state.activeProject = id; state.activeView = "project"; }
      saveState(); render();
    });
    $("#mobileUserSelect").addEventListener("change", e => chooseUser(e.target.value));
    $("#imageBtn").onclick = () => $("#imageInput").click();
    $("#imageInput").onchange = e => { addImageFiles(e.target.files); e.target.value = ""; };
    $("#messageInput").addEventListener("paste", e => {
      const images = [...e.clipboardData.items].filter(item => item.type.startsWith("image/")).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      e.preventDefault();
      addImageFiles(images);
    });
    $("#imagePreview").onclick = e => {
      const button = e.target.closest("[data-remove-image]");
      if (!button) return;
      pendingImages.splice(Number(button.dataset.removeImage), 1);
      renderImagePreview();
    };
    $("#personalNoteEditor").addEventListener("input", e => {
      clearTimeout(window.personalNoteTimer);
      window.personalNoteTimer = setTimeout(() => {
        const user = state.users[state.noteUser] || activeUser();
        user.personalNote = e.target.value;
        saveState(true);
      }, 350);
    });
    $("#personalNoteEditor").addEventListener("paste", e => {
      const images = [...e.clipboardData.items].filter(item => item.type.startsWith("image/")).map(item => item.getAsFile()).filter(Boolean);
      if (!images.length) return;
      e.preventDefault();
      addPersonalNoteImages(images);
    });
    function syncMobileViewport() {
      const viewport = window.visualViewport;
      document.documentElement.style.setProperty("--app-height", `${viewport ? viewport.height : window.innerHeight}px`);
    }
    syncMobileViewport();
    window.addEventListener("resize", syncMobileViewport);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncMobileViewport);
    }
    $("#settingsBtn").onclick = openSettings;
    $("#addProjectBtn").onclick = openProjectModal;
    $("#formModal").addEventListener("click", e => {
      if (e.target.id === "createProjectBtn") {
        const name = $("#newProjectName").value.trim(); if (!name) return toast("프로젝트 이름을 입력해주세요");
        const id = crypto.randomUUID(); state.projects.push({ id, name, desc: $("#newProjectDesc").value.trim() || "Shared project", color: $("#newProjectColor").value }); state.activeProject = id; state.activeView = "project"; saveState(true); $("#formModal").classList.add("hidden"); render();
      }
      if (e.target.id === "saveSettingsBtn") {
        $$("[data-name-setting]").forEach(x => state.users[x.dataset.nameSetting].name = x.value.trim() || state.users[x.dataset.nameSetting].name);
        $$("[data-color-setting]").forEach(x => state.users[x.dataset.colorSetting].color = x.value);
        state.settings.showNames = $("#showNamesSetting").checked; saveState(true); $("#formModal").classList.add("hidden"); render(); toast("설정을 저장했습니다");
      }
    });
    $("#lightbox").onclick = () => $("#lightbox").classList.add("hidden");
    if (window.matchMedia("(max-width: 720px)").matches) state.activeView = "today";
    render();
    if (!state.activeUser) $("#userModal").classList.remove("hidden");
    initializeSupabase();
  </script>
</body>
</html>
